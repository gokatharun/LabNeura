[build-system]
requires = ["setuptools>=61", "wheel>=0.37"]
build-backend = "setuptools.build_meta"

[project]
name = "labneura"
dynamic = ["version"]
description = "Platform-independent umbrella for LabNeura Tensor and EDA"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "LabNeura Authors" }]
dependencies = [
  "labneura-tensor>=0.5,<0.6",
  "labneura-eda>=0.5,<0.6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "labneura.__version__" }
