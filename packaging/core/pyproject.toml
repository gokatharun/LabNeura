[build-system]
requires = ["setuptools>=61", "wheel>=0.37"]
build-backend = "setuptools.build_meta"

[project]
name = "labneura-core"
dynamic = ["version"]
description = "Pure-Python package infrastructure for LabNeura components"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "LabNeura Authors" }]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "labneura.__version__" }
