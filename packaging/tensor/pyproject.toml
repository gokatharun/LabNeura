[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "labneura-tensor"
version = "0.4.5"
description = "SIMD-accelerated Tensor component for LabNeura"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "LabNeura Authors" }]
dependencies = ["labneura-core>=0.4.2,<0.5"]

[tool.scikit-build]
cmake.source-dir = "../.."
cmake.args = [
  "-DLABNEURA_BUILD_ACCEL_CORE=ON",
  "-DLABNEURA_BUILD_TENSOR=ON",
  "-DLABNEURA_BUILD_EDA=OFF",
  "-DLABNEURA_BUILD_COMPAT=OFF",
  "-DLABNEURA_BUILD_PYTHON_TENSOR_EXTENSION=ON",
  "-DLABNEURA_BUILD_PYTHON_EDA_EXTENSION=OFF",
]
wheel.packages = []
wheel.install-dir = "labneura"
