name: LabNeura CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gcc-source-build:
    name: Source build (GCC 13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GCC 13
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13

      - name: Install Python test dependencies
        run: make deps

      - name: Build and test with GCC 13
        run: |
          export CC=gcc-13
          export CXX=g++-13
          make clean install test

  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      # ----------------------------------
      # Checkout
      # ----------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------
      # Python
      # ----------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ----------------------------------
      # System dependencies
      # ----------------------------------
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
          sudo apt-get update || true
          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            llvm-dev \
            lld 
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update || true
          brew install llvm || true
      
      # ----------------------------------
      # Python dependencies
      # ----------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov numpy setuptools wheel pybind11

      - name: Ensure LLVM tools are available
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            if ! command -v llvm-profdata >/dev/null 2>&1; then
              echo "🔧 Installing LLVM via Homebrew"
              brew install llvm
            fi

            echo "LLVM_PROFDATA=$(xcrun --find llvm-profdata)" >> $GITHUB_ENV
            echo "LLVM_COV=$(xcrun --find llvm-cov)" >> $GITHUB_ENV

          else
            if ! command -v llvm-profdata >/dev/null 2>&1; then
              echo "🔧 Installing LLVM via apt"
              sudo apt-get update
              sudo apt-get install -y llvm clang
            fi

            echo "LLVM_PROFDATA=$(command -v llvm-profdata)" >> $GITHUB_ENV
            echo "LLVM_COV=$(command -v llvm-cov)" >> $GITHUB_ENV
          fi

      # ----------------------------------
      # Run CI via Makefile
      # ----------------------------------
      - name: Run LabNeura CI (Linux)
        if: runner.os == 'Linux'
        run: |
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          export LABNEURA_COVERAGE=1
          make ci

      - name: Run LabNeura CI (macOS)
        if: runner.os == 'macOS'
        run: |
          export CC=clang
          export CXX=clang++
          export LABNEURA_COVERAGE=1
          make ci
      
      # ----------------------------------
      # Upload coverage reports
      # ----------------------------------
      - name: Upload coverage artifact
        if: |
          matrix.os == 'ubuntu-latest' &&
          matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: labneura-coverage
          path: |
            coverage.txt
            coverage_html


# ============================================================
# Job 2: Publish Coverage (Single job)
# ============================================================
  publish-coverage:
    name: Publish LLVM Coverage
    runs-on: ubuntu-latest
    needs: build-test

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: labneura-coverage
          path: coverage_artifact

      - name: Publish coverage to repository
        run: |
          mkdir -p coverage/html

          rm -rf coverage/html/*
          cp coverage_artifact/coverage.txt coverage/coverage.txt
          cp -r coverage_artifact/coverage_html/* coverage/html/

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add coverage

          if git diff --cached --quiet; then
            echo "No coverage changes"
            exit 0
          fi

          git commit -m "ci: publish LLVM C++ coverage"
          git push