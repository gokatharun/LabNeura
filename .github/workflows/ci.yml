name: LabNeura CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      # ----------------------------------
      # Checkout
      # ----------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------
      # Python
      # ----------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ----------------------------------
      # System dependencies
      # ----------------------------------
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            llvm-dev \
            lld \ 

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update

      # ----------------------------------
      # Python dependencies
      # ----------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov numpy setuptools wheel pybind11

      # ----------------------------------
      # Run CI via Makefile
      # ----------------------------------
      - name: Run LabNeura CI
        run: |
          make ci

      # ----------------------------------
      # Upload Python coverage (optional)
      # ----------------------------------
      - name: Upload Python coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .coverage
          if-no-files-found: ignore