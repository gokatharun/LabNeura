name: LabNeura CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      # ----------------------------------
      # Checkout
      # ----------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------
      # Python
      # ----------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ----------------------------------
      # System dependencies
      # ----------------------------------
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
          sudo apt-get update || true
          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            llvm-dev \
            lld 
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update || true
          brew install llvm || true
      
      # ----------------------------------
      # Python dependencies
      # ----------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov numpy setuptools wheel pybind11

      - name: Ensure LLVM tools are available
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            if ! command -v llvm-profdata >/dev/null 2>&1; then
              echo "🔧 Installing LLVM via Homebrew"
              brew install llvm
            fi

            LLVM_PREFIX=$(brew --prefix llvm)
            echo "LLVM_PROFDATA=$LLVM_PREFIX/bin/llvm-profdata" >> $GITHUB_ENV
            echo "LLVM_COV=$LLVM_PREFIX/bin/llvm-cov" >> $GITHUB_ENV

          else
            if ! command -v llvm-profdata >/dev/null 2>&1; then
              echo "🔧 Installing LLVM via apt"
              sudo apt-get update
              sudo apt-get install -y llvm clang
            fi

            echo "LLVM_PROFDATA=$(command -v llvm-profdata)" >> $GITHUB_ENV
            echo "LLVM_COV=$(command -v llvm-cov)" >> $GITHUB_ENV
          fi

      # ----------------------------------
      # Run CI via Makefile
      # ----------------------------------
      - name: Run LabNeura CI (Linux)
        if: runner.os == 'Linux'
        run: |
          export CC=clang
          export CXX=clang++
          export LABNEURA_COVERAGE=1
          make ci

      - name: Run LabNeura CI (macOS)
        if: runner.os == 'macOS'
        run: |
          make ci

      # ----------------------------------
      # Upload Python coverage (optional)
      # ----------------------------------
      # - name: Comment LLVM coverage on PR
      #   uses: actions/github-script@v7
      #   with:
      #     script: |
      #       const fs = require('fs');
      #       const body = fs.readFileSync('coverage.txt', 'utf8');
      #       github.rest.issues.createComment({
      #         issue_number: context.issue.number,
      #         owner: context.repo.owner,
      #         repo: context.repo.repo,
      #         body: "### 🔍 C++ LLVM Coverage Report\n```\n" + body + "\n```"
      #       });

      - name: Upload LLVM C++ coverage (HTML)
        uses: actions/upload-artifact@v4
        with:
          name: llvm-cpp-coverage
          path: coverage_html