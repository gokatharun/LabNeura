name: LabNeura CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'benchmarking/results/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'benchmarking/results/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture and developer commands
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest
      - run: make check
      - run: python -m pytest -q tests/architecture tests/test_dev_commands.py tests/test_release_inventory.py

  native:
    name: Native C++ (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x86_64-gcc, cc: gcc, cxx: g++}
          - {os: ubuntu-24.04-arm, platform: linux-arm64-gcc, cc: gcc, cxx: g++}
          - {os: macos-latest, platform: macos-arm64-appleclang, cc: clang, cxx: clang++}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ci-cache/ccache
          key: ccache-${{ matrix.platform }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'include/**') }}
          restore-keys: ccache-${{ matrix.platform }}-
      - name: Configure one Release tree
        run: >-
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON -DLABNEURA_ENABLE_SLANG_VALIDATION=OFF
          -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - name: Build and test every component once
        run: |
          cmake --build build/native --parallel 2
          ctest --test-dir build/native --output-on-failure --no-tests=error
      - name: Build benchmark executables
        run: |
          cmake --build build/native --target labneura_native_backend_benchmark --parallel 2
          cmake --build build/native --target labneura_lexer_benchmark --parallel 2
          cmake --build build/native --target labneura_preprocessor_benchmark --parallel 2
      - name: Upload native logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-logs-${{ matrix.platform }}
          path: build/native/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  native-windows:
    name: Native C++ (windows-x86_64-msvc)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with: {arch: x64}
      - name: Configure, build, and test one Release tree
        shell: pwsh
        run: |
          cmake -S . -B build/native -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DLABNEURA_ENABLE_SLANG_VALIDATION=OFF -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          cmake --build build/native --config Release --parallel
          ctest --test-dir build/native -C Release --output-on-failure --no-tests=error

  native-coverage:
    name: Native coverage (${{ matrix.platform }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x86_64-clang, backend: x86_64}
          - {os: ubuntu-24.04-arm, platform: linux-arm64-clang, backend: arm64}
    env:
      CC: clang
      CXX: clang++
      LLVM_PROFILE_FILE: ${{ github.workspace }}/build/coverage/profiles/%p-%m.profraw
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM coverage tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Configure instrumented native build
        run: >-
          cmake -S . -B build/coverage -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON -DLABNEURA_ENABLE_COVERAGE=ON
          -DLABNEURA_ENABLE_SLANG_VALIDATION=OFF
          -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - name: Build and execute native CTests
        run: |
          cmake --build build/coverage --parallel 2
          mkdir -p build/coverage/profiles
          set -o pipefail
          ctest --test-dir build/coverage --output-on-failure --no-tests=error | tee coverage-ctest.log
      - name: Require supported SIMD and scalar coverage tests to execute
        env:
          COVERAGE_BACKEND: ${{ matrix.backend }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          log = Path("coverage-ctest.log").read_text(encoding="utf-8")
          statuses = {}
          for match in re.finditer(
              r"Test\s+#\d+:\s+(\S+).*?(Passed|Skipped|Failed)", log
          ):
              statuses[match.group(1)] = match.group(2)

          generic = {
              "backend_selection", "fp32_generic_allocating", "add_into_generic",
              "tensor_nd_generic", "tensor_comparison_generic", "bool_dtype_generic",
              "eda_verilog_lexer_scalar",
          }
          x86 = {
              "avx2_int8_multiplication", "avx2_integer_arithmetic",
              "fp32_avx2_allocating", "add_into_avx2", "tensor_nd_avx2",
              "tensor_comparison_avx2", "bool_dtype_avx2", "avx2_allocation_safety",
              "fp16_f16c_dispatch", "avx2_fp16_arithmetic", "eda_verilog_lexer_avx2",
          }
          arm = {
              "neon_int8_subtraction", "fp32_neon_allocating", "add_into_neon",
              "tensor_nd_neon", "tensor_comparison_neon", "bool_dtype_neon",
              "neon_fp16_arithmetic", "eda_verilog_lexer_neon",
          }
          required = generic | (x86 if os.environ["COVERAGE_BACKEND"] == "x86_64" else arm)
          missing = sorted(name for name in required if statuses.get(name) != "Passed")
          if missing:
              raise SystemExit(
                  "required backend tests did not execute and pass: "
                  f"{[(name, statuses.get(name)) for name in missing]}"
              )
          print("PASS: required scalar and SIMD coverage tests executed")
          PY
      - name: Generate coverage report
        run: |
          python scripts/coverage_report.py --toolchain llvm --build-dir build/coverage --profiles build/coverage/profiles --output coverage/native
          python scripts/write_coverage_summary.py --native coverage/native/native-summary.json --output COVERAGE.md
          cat COVERAGE.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: native-coverage-${{ matrix.platform }}
          path: |
            COVERAGE.md
            coverage/native
            coverage-ctest.log
          if-no-files-found: error

  wheels:
    name: Three distributions and isolated installation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install build scikit-build-core pybind11 wheel 'setuptools>=61' pytest packaging
      - name: Create wheelhouse
        shell: python
        run: |
          from pathlib import Path
          Path("wheelhouse").mkdir()
      - name: Build Core wheel
        env: {CMAKE_BUILD_PARALLEL_LEVEL: '2'}
        run: >-
          python -m build --wheel --no-isolation --outdir wheelhouse packaging/core
      - name: Build Tensor wheel
        env: {CMAKE_BUILD_PARALLEL_LEVEL: '2'}
        run: python -m build --wheel --no-isolation --outdir wheelhouse packaging/tensor
      - name: Build EDA wheel
        env: {CMAKE_BUILD_PARALLEL_LEVEL: '2'}
        run: python -m build --wheel --no-isolation --outdir wheelhouse packaging/eda
      - name: Verify ownership, dependencies, and clean installs
        shell: python
        run: |
          import subprocess
          version = subprocess.check_output(
              ["python", "scripts/update_version.py", "--get-version"], text=True
          ).strip()
          subprocess.run(
              ["python", "scripts/verify_wheel_matrix.py", "wheelhouse",
               "--version", version, "--workdir", "wheel-matrix"],
              check=True,
          )
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-wheelhouse-${{ runner.os }}
          path: wheelhouse
          if-no-files-found: error

  python-regressions:
    name: Python regression suite
    runs-on: ubuntu-24.04
    needs: wheels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest numpy
      - uses: actions/download-artifact@v4
        with:
          name: smoke-wheelhouse-Linux
          path: wheelhouse
      - name: Install the exact Linux wheel artifacts
        run: python -m pip install --no-index wheelhouse/*.whl
      - run: python -m pytest -q tests
