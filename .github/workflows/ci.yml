name: LabNeura CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gcc-source-build:
    name: Source build (GCC 13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GCC 13
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13

      - name: Install Python test dependencies
        run: make deps

      - name: Build and test with GCC 13
        run: |
          export CC=gcc-13
          export CXX=g++-13
          make clean install test

  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      # ----------------------------------
      # Checkout
      # ----------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------
      # Python
      # ----------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ----------------------------------
      # System dependencies
      # ----------------------------------
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
          sudo apt-get update || true
          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            llvm-dev \
            lld
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update || true
          brew install llvm || true

      # ----------------------------------
      # Python dependencies
      # ----------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov numpy setuptools wheel pybind11

      - name: Ensure LLVM tools are available
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            if ! command -v llvm-profdata >/dev/null 2>&1; then
              echo "Installing LLVM via Homebrew"
              brew install llvm
            fi

            echo "LLVM_PROFDATA=$(xcrun --find llvm-profdata)" >> $GITHUB_ENV
            echo "LLVM_COV=$(xcrun --find llvm-cov)" >> $GITHUB_ENV

          else
            CLANG_VERSION=$(/usr/bin/clang --version | sed -n 's/.*version \([0-9][0-9]*\)\..*/\1/p' | head -n 1)
            if [ -z "$CLANG_VERSION" ]; then
              echo "Could not determine the installed Clang version"
              exit 1
            fi

            LLVM_PROFDATA_TOOL="llvm-profdata-$CLANG_VERSION"
            LLVM_COV_TOOL="llvm-cov-$CLANG_VERSION"
            if ! command -v "$LLVM_PROFDATA_TOOL" >/dev/null 2>&1 ||
               ! command -v "$LLVM_COV_TOOL" >/dev/null 2>&1; then
              echo "Installing LLVM $CLANG_VERSION coverage tools"
              sudo apt-get update
              sudo apt-get install -y "llvm-$CLANG_VERSION"
            fi

            LLVM_PROFDATA_PATH=$(command -v "$LLVM_PROFDATA_TOOL")
            LLVM_COV_PATH=$(command -v "$LLVM_COV_TOOL")
            "$LLVM_PROFDATA_PATH" --version
            "$LLVM_COV_PATH" --version
            echo "LLVM_PROFDATA=$LLVM_PROFDATA_PATH" >> $GITHUB_ENV
            echo "LLVM_COV=$LLVM_COV_PATH" >> $GITHUB_ENV
          fi

      # ----------------------------------
      # Run CI via Makefile
      # ----------------------------------
      - name: Run LabNeura CI (Linux)
        if: runner.os == 'Linux'
        run: |
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          export LABNEURA_COVERAGE=1
          make ci

      - name: Run LabNeura CI (macOS)
        if: runner.os == 'macOS'
        run: |
          export CC=clang
          export CXX=clang++
          export LABNEURA_COVERAGE=1
          make ci

      # ----------------------------------
      # Upload coverage reports
      # ----------------------------------
      - name: Upload coverage artifact
        if: |
          matrix.os == 'ubuntu-latest' &&
          matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: labneura-coverage
          path: |
            coverage.txt
            coverage_html

  native-simd:
    name: Native SIMD tests and benchmarks (${{ matrix.architecture }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x86_64
          - os: ubuntu-24.04-arm
            architecture: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for x86_64 AVX2 validation
        if: matrix.architecture == 'x86_64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify x86_64 CPU features
        if: matrix.architecture == 'x86_64'
        run: |
          lscpu
          python - <<'PY'
          from pathlib import Path

          lines = Path("/proc/cpuinfo").read_text().splitlines()
          model = next(
              (line.split(":", 1)[1].strip()
               for line in lines if line.startswith("model name")),
              "unknown",
          )
          flags_line = next(
              (line.split(":", 1)[1]
               for line in lines if line.startswith(("flags", "Features"))),
              "",
          )
          flags = set(flags_line.split())
          print(f"AVX2 validation CPU: {model}")
          print(f"AVX2 supported: {'avx2' in flags}")
          print(f"F16C supported: {'f16c' in flags}")
          if "avx2" not in flags:
              raise SystemExit("This x86_64 runner does not expose AVX2")
          PY

      - name: Configure native build
        run: |
          cmake -S . -B build/native \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build native tests and benchmark
        run: cmake --build build/native --parallel 2

      - name: Verify AVX2 and F16C compiler flags
        if: matrix.architecture == 'x86_64'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          commands = json.loads(
              Path("build/native/compile_commands.json").read_text()
          )
          avx_sources = (
              "avx2_backend.cpp",
              "avx2_ops_int8.cpp",
              "avx2_ops_int16.cpp",
              "avx2_ops_fp32.cpp",
              "avx2_ops_fp16.cpp",
          )
          for name in avx_sources:
              entry = next(
                  (item for item in commands if item["file"].endswith(name)),
                  None,
              )
              if entry is None or "-mavx2" not in entry["command"]:
                  raise SystemExit(f"{name} was not compiled with -mavx2")
              print(f"AVX2 flags confirmed: {name}")

          f16c = next(
              (item for item in commands
               if item["file"].endswith("avx2_ops_fp16_f16c.cpp")),
              None,
          )
          flags_line = next(
              (line.split(":", 1)[1]
               for line in Path("/proc/cpuinfo").read_text().splitlines()
               if line.startswith("flags")),
              "",
          )
          cpu_flags = set(flags_line.split())
          if f16c is None:
              if "f16c" in cpu_flags:
                  raise SystemExit(
                      "CPU supports F16C but the F16C kernel was not compiled"
                  )
              print("F16C kernel was not compiled by this toolchain")
          elif "-mavx2" not in f16c["command"] or "-mf16c" not in f16c["command"]:
              raise SystemExit("F16C kernel is missing -mavx2 or -mf16c")
          else:
              print("F16C flags confirmed: -mavx2 -mf16c")
          PY

      - name: Confirm AVX2 runtime dispatch
        if: matrix.architecture == 'x86_64'
        env:
          LABNEURA_BACKEND: AVX2
        run: build/native/labneura_backend_selection_test

      - name: Run native C++ tests
        if: matrix.architecture == 'x86_64'
        env:
          LABNEURA_BACKEND: AVX2
        run: ctest --test-dir build/native --output-on-failure

      - name: Run native C++ tests (aarch64)
        if: matrix.architecture == 'aarch64'
        run: ctest --test-dir build/native --output-on-failure

      - name: Run AVX2 allocation, nD, and FP16/F16C tests verbosely
        if: matrix.architecture == 'x86_64'
        env:
          LABNEURA_BACKEND: AVX2
        run: |
          ctest --test-dir build/native -V \
            -R '^(avx2_allocation_safety|tensor_nd_avx2|fp16_f16c_dispatch|avx2_fp16_arithmetic)$'

      - name: Install package and run full Python suite with AVX2
        if: matrix.architecture == 'x86_64'
        env:
          LABNEURA_BACKEND: AVX2
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy
          python -m pip install .
          python -c "import labneura; assert labneura.detect_backend() == 'AVX2'; print('Selected backend:', labneura.detect_backend())"
          python -m pytest -q

      - name: Run native backend benchmarks
        if: github.event_name != 'pull_request'
        run: |
          build/native/labneura_native_backend_benchmark \
            benchmark-${{ matrix.architecture }}.csv

      - name: Upload native benchmark results
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: simd-benchmarks-${{ matrix.architecture }}
          path: benchmark-${{ matrix.architecture }}.csv
          if-no-files-found: error

  python-benchmarks:
    name: Python API benchmarks vs NumPy/PyTorch (${{ matrix.architecture }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x86_64
          - os: ubuntu-24.04-arm
            architecture: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install LabNeura and benchmark-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install -r benchmarking/requirements.txt pytest

      - name: Test benchmark helpers
        run: python -m pytest tests/test_benchmark_runner.py

      - name: Run Python benchmark smoke test
        run: python benchmarking/run_benchmarks.py --smoke --output-dir python-benchmark-smoke

      - name: Run Python benchmarks
        run: python benchmarking/run_benchmarks.py --output-dir python-benchmark-${{ matrix.architecture }}

      - name: Upload Python benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: python-benchmarks-${{ matrix.architecture }}
          path: python-benchmark-${{ matrix.architecture }}
          if-no-files-found: error

  publish-ci-reports:
    name: Publish CI reports
    runs-on: ubuntu-latest
    needs: [build-test, native-simd, python-benchmarks]
    concurrency:
      group: ci-report-publish-${{ github.ref }}
      cancel-in-progress: false

    if: |
      !cancelled() &&
      needs.build-test.result == 'success' &&
      needs.native-simd.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: labneura-coverage
          path: ci_artifacts

      - name: Download native benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: simd-benchmarks-*
          path: ci_artifacts
          merge-multiple: true

      - name: Download Python benchmark artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: python-benchmarks-*
          path: python_artifacts

      - name: Update checkout to latest main
        run: git pull --rebase origin main

      - name: Generate and publish CI reports
        run: |
          mkdir -p coverage/html

          rm -rf coverage/html/*
          cp ci_artifacts/coverage.txt coverage/coverage.txt
          cp -r ci_artifacts/coverage_html/* coverage/html/
          python benchmarking/publish_ci_results.py \
            --results-dir ci_artifacts \
            --output benchmarking/results/latest.md \
            --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          mkdir -p benchmarking/results/python
          if [ -d python_artifacts ]; then
            rm -rf benchmarking/results/python
            mkdir -p benchmarking/results/python
            {
              echo "# Python API benchmarks (LabNeura vs NumPy/PyTorch)"
              echo
              echo "Commit: \`$GITHUB_SHA\` - [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
              echo
              echo "Each architecture is measured on its own runner; do not compare across rows."
              echo
            } > benchmarking/results/python/README.md
            for dir in python_artifacts/python-benchmarks-*; do
              [ -d "$dir" ] || continue
              arch="${dir##*python-benchmarks-}"
              mkdir -p "benchmarking/results/python/$arch"
              cp -r "$dir"/. "benchmarking/results/python/$arch/"
              echo "- [$arch report]($arch/report.md) ([JSON]($arch/benchmark.json), [CSV]($arch/benchmark.csv))" \
                >> benchmarking/results/python/README.md
            done
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add coverage benchmarking/results/latest.md benchmarking/results/python

          if git diff --cached --quiet; then
            echo "No generated report changes"
            exit 0
          fi

          git commit -m "ci: publish coverage and benchmarks [skip ci]"
          git push origin HEAD:main
