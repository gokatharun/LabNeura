name: Publish Python Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sync-release-version:
    name: Sync release version
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update version files from release tag
        run: >-
          python -c "import os, subprocess, sys; subprocess.run([sys.executable,
          'scripts/update_version.py', '--version', os.environ['GITHUB_REF_NAME'].removeprefix('v')], check=True)"

      - name: Open version sync pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/sync-release-version
          delete-branch: true
          add-paths: |
            pyproject.toml
            CMakeLists.txt
            python/labneura_py.cpp
            packaging/core/src/labneura/__init__.py
            packaging/tensor/pyproject.toml
            packaging/eda/pyproject.toml
            packaging/compat/pyproject.toml
            packaging/all/pyproject.toml
          commit-message: "chore: sync version for ${{ github.event.release.tag_name }}"
          title: "chore: sync version for ${{ github.event.release.tag_name }}"
          body: |
            Sync package version declarations with release tag `${{ github.event.release.tag_name }}`.

            The release workflow builds and publishes using this tag as the package version.

  build:
    name: Build split distributions (${{ matrix.platform }}, ${{ matrix.python_group }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            linux_arch: x86_64
            python_group: cp38-cp39
            cibw_build: cp38-* cp39-*
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            linux_arch: x86_64
            python_group: cp310-cp311
            cibw_build: cp310-* cp311-*
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            linux_arch: x86_64
            python_group: cp312-cp313
            cibw_build: cp312-* cp313-*
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            arch: arm64
            linux_arch: aarch64
            python_group: cp38-cp39
            cibw_build: cp38-* cp39-*
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            arch: arm64
            linux_arch: aarch64
            python_group: cp310-cp311
            cibw_build: cp310-* cp311-*
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            arch: arm64
            linux_arch: aarch64
            python_group: cp312-cp313
            cibw_build: cp312-* cp313-*
          - os: macos-15-intel
            platform: macos-intel
            arch: x86_64
            linux_arch: ""
            python_group: cp38-cp39
            cibw_build: cp38-* cp39-*
          - os: macos-15-intel
            platform: macos-intel
            arch: x86_64
            linux_arch: ""
            python_group: cp310-cp311
            cibw_build: cp310-* cp311-*
          - os: macos-15-intel
            platform: macos-intel
            arch: x86_64
            linux_arch: ""
            python_group: cp312-cp313
            cibw_build: cp312-* cp313-*
          - os: macos-latest
            platform: macos-arm64
            arch: arm64
            linux_arch: ""
            python_group: cp38-cp39
            cibw_build: cp38-* cp39-*
          - os: macos-latest
            platform: macos-arm64
            arch: arm64
            linux_arch: ""
            python_group: cp310-cp311
            cibw_build: cp310-* cp311-*
          - os: macos-latest
            platform: macos-arm64
            arch: arm64
            linux_arch: ""
            python_group: cp312-cp313
            cibw_build: cp312-* cp313-*
          - os: windows-2022
            platform: windows-amd64
            arch: AMD64
            linux_arch: ""
            python_group: cp38-cp39
            cibw_build: cp38-* cp39-*
          - os: windows-2022
            platform: windows-amd64
            arch: AMD64
            linux_arch: ""
            python_group: cp310-cp311
            cibw_build: cp310-* cp311-*
          - os: windows-2022
            platform: windows-amd64
            arch: AMD64
            linux_arch: ""
            python_group: cp312-cp313
            cibw_build: cp312-* cp313-*

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enable MSVC Release toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set package version from release tag
        if: github.event_name == 'release'
        run: >-
          python -c "import os, subprocess, sys; subprocess.run([sys.executable,
          'scripts/update_version.py', '--version', os.environ['GITHUB_REF_NAME'].removeprefix('v')], check=True)"

      - name: Validate package version declarations
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/update_version.py --check

      - name: Install wheel build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build cibuildwheel==2.22.0 scikit-build-core pybind11 wheel 'setuptools>=61' pytest packaging

      - name: Build Tensor wheels for supported CPython versions
        shell: bash
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_ARCHS_LINUX: ${{ matrix.linux_arch }}
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
          WHEELHOUSE: ${{ runner.temp }}/wheelhouse
        run: |
          mkdir -p "$WHEELHOUSE/tensor"
          python -m cibuildwheel packaging/tensor --output-dir "$WHEELHOUSE/tensor"

      - name: Build EDA wheels for supported CPython versions
        shell: bash
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_ARCHS_LINUX: ${{ matrix.linux_arch }}
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
          WHEELHOUSE: ${{ runner.temp }}/wheelhouse
        run: |
          mkdir -p "$WHEELHOUSE/eda"
          python -m cibuildwheel packaging/eda --output-dir "$WHEELHOUSE/eda"

      - name: Validate native wheel versions
        shell: bash
        env:
          WHEELHOUSE: ${{ runner.temp }}/wheelhouse
        run: |
          python - "$WHEELHOUSE" "$(python scripts/update_version.py --get-version)" <<'PY'
          import sys
          from email import message_from_bytes
          from pathlib import Path
          from zipfile import ZipFile

          wheelhouse = Path(sys.argv[1])
          expected_version = sys.argv[2]
          wheels = sorted(wheelhouse.rglob("*.whl"))
          if not wheels:
              raise SystemExit(f"no native wheels found in {wheelhouse}")

          mismatches = []
          for wheel in wheels:
              with ZipFile(wheel) as archive:
                  metadata_path = next(
                      path for path in archive.namelist()
                      if path.endswith(".dist-info/METADATA")
                  )
                  metadata = message_from_bytes(archive.read(metadata_path))
              if metadata["Version"] != expected_version:
                  mismatches.append(
                      f"{wheel.name}: {metadata['Version']} "
                      f"(expected {expected_version})"
                  )
          if mismatches:
              raise SystemExit(
                  "wheel version mismatch before artifact upload:\n"
                  + "\n".join(mismatches)
              )
          print(f"Validated {len(wheels)} native wheels at {expected_version}")
          PY

      - name: Upload native wheel group
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.python_group }}
          path: ${{ runner.temp }}/wheelhouse/
          if-no-files-found: error

  build-pure-distributions:
    name: Build pure Python distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set package version from release tag
        if: github.event_name == 'release'
        run: >-
          python -c "import os, subprocess, sys; subprocess.run([sys.executable,
          'scripts/update_version.py', '--version', os.environ['GITHUB_REF_NAME'].removeprefix('v')], check=True)"

      - name: Validate package version declarations
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/update_version.py --check

      - name: Install wheel build tools
        run: python -m pip install --upgrade pip build 'setuptools>=61' wheel packaging

      - name: Build pure Python wheels
        env:
          WHEELHOUSE: ${{ runner.temp }}/pure-wheelhouse
        run: |
          mkdir -p "$WHEELHOUSE"
          python -m build --wheel --no-isolation --outdir "$WHEELHOUSE" packaging/core
          python -m build --wheel --no-isolation --outdir "$WHEELHOUSE" packaging/compat
          python -m build --wheel --no-isolation --outdir "$WHEELHOUSE" packaging/all

      - name: Validate pure wheel versions
        env:
          WHEELHOUSE: ${{ runner.temp }}/pure-wheelhouse
        run: |
          python - "$WHEELHOUSE" "$(python scripts/update_version.py --get-version)" <<'PY'
          import sys
          from email import message_from_bytes
          from pathlib import Path
          from zipfile import ZipFile

          wheelhouse = Path(sys.argv[1])
          expected_version = sys.argv[2]
          wheels = sorted(wheelhouse.glob("*.whl"))
          if len(wheels) != 3:
              raise SystemExit(f"expected 3 pure wheels, found {len(wheels)}")

          mismatches = []
          for wheel in wheels:
              with ZipFile(wheel) as archive:
                  metadata_path = next(
                      path for path in archive.namelist()
                      if path.endswith(".dist-info/METADATA")
                  )
                  metadata = message_from_bytes(archive.read(metadata_path))
              if metadata["Version"] != expected_version:
                  mismatches.append(
                      f"{wheel.name}: {metadata['Version']} "
                      f"(expected {expected_version})"
                  )
          if mismatches:
              raise SystemExit(
                  "wheel version mismatch before artifact upload:\n"
                  + "\n".join(mismatches)
              )
          print(f"Validated 3 pure wheels at {expected_version}")
          PY

      - name: Upload pure Python wheels
        uses: actions/upload-artifact@v4
        with:
          name: pure-distributions
          path: ${{ runner.temp }}/pure-wheelhouse/
          if-no-files-found: error

  build-source-distribution:
    name: Build and qualify native EDA source distribution
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set package version from release tag
        if: github.event_name == 'release'
        run: >-
          python -c "import os, subprocess, sys; subprocess.run([sys.executable,
          'scripts/update_version.py', '--version', os.environ['GITHUB_REF_NAME'].removeprefix('v')], check=True)"

      - name: Validate package version declarations
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/update_version.py --check

      - name: Install source build tools
        run: python -m pip install --upgrade pip build scikit-build-core pybind11 wheel twine

      - name: Build self-contained EDA sdist
        run: python scripts/build_eda_sdist.py --outdir "$RUNNER_TEMP/sdist"

      - name: Audit and rebuild EDA sdist
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
          CMAKE_ARGS: >-
            -DLABNEURA_ENABLE_SLANG_VALIDATION=OFF
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON
        run: |
          python - "$RUNNER_TEMP/sdist" <<'PY'
          import sys, tarfile
          from pathlib import Path

          dist = Path(sys.argv[1])
          archives = list(dist.glob("labneura_eda-*.tar.gz"))
          if len(archives) != 1:
              raise SystemExit(f"expected one EDA sdist, found {archives}")
          with tarfile.open(archives[0], "r:gz") as archive:
              names = archive.getnames()
          required = ("/CMakeLists.txt", "/python/eda_module.cpp", "/src/labneura/eda/")
          missing = [item for item in required if not any(item in name for name in names)]
          if missing:
              raise SystemExit(f"EDA sdist is incomplete; missing {missing}")
          slang = [name for name in names if "slang" in name.lower()]
          if slang:
              raise SystemExit(f"EDA sdist bundles Slang content: {slang}")
          binaries = [
              name for name in names
              if Path(name).suffix.lower() in {".so", ".dylib", ".dll", ".pyd", ".a", ".o"}
          ]
          if binaries:
              raise SystemExit(f"EDA sdist bundles compiled binaries: {binaries}")
          PY
          mkdir -p "$RUNNER_TEMP/sdist-source" "$RUNNER_TEMP/sdist-rebuilt"
          tar -xzf "$RUNNER_TEMP"/sdist/labneura_eda-*.tar.gz -C "$RUNNER_TEMP/sdist-source"
          SDIST_ROOT=$(find "$RUNNER_TEMP/sdist-source" -mindepth 1 -maxdepth 1 -type d -print -quit)
          python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/sdist-rebuilt" "$SDIST_ROOT"
          python -m twine check "$RUNNER_TEMP"/sdist/labneura_eda-*.tar.gz
          test "$(find "$RUNNER_TEMP/sdist-rebuilt" -name 'labneura_eda-*.whl' | wc -l)" -eq 1

      - name: Upload qualified EDA sdist
        uses: actions/upload-artifact@v4
        with:
          name: source-distributions
          path: ${{ runner.temp }}/sdist/labneura_eda-*.tar.gz
          if-no-files-found: error
          retention-days: 30

  native-release-tests:
    name: Native EDA release tests (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-2022
            platform: windows-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Enable MSVC Release toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure, build, and test EDA-only on Linux and macOS
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build/eda-release-native \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DLABNEURA_BUILD_ACCEL_CORE=OFF \
            -DLABNEURA_BUILD_TENSOR=OFF \
            -DLABNEURA_BUILD_COMPAT=OFF \
            -DLABNEURA_BUILD_EDA=ON \
            -DLABNEURA_ENABLE_SLANG_VALIDATION=OFF \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          cmake --build build/eda-release-native --parallel 2
          ctest --test-dir build/eda-release-native --output-on-failure --no-tests=error

      - name: Configure, build, and strictly test EDA-only on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build/eda-release-native `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON `
            -DLABNEURA_BUILD_ACCEL_CORE=OFF `
            -DLABNEURA_BUILD_TENSOR=OFF `
            -DLABNEURA_BUILD_COMPAT=OFF `
            -DLABNEURA_BUILD_EDA=ON `
            -DLABNEURA_ENABLE_SLANG_VALIDATION=OFF `
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          cmake --build build/eda-release-native --config Release --parallel 2
          $ctestOutput = ctest --test-dir build/eda-release-native -C Release `
            --output-on-failure --no-tests=error 2>&1
          $ctestOutput | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "Windows EDA-only CTest failed" }
          if ($ctestOutput -match "(?im)Not Run|\*\*\*Skipped") {
            throw "Windows EDA-only CTest contains a missing executable or skip"
          }

  verify-platform-wheels:
    name: Verify wheels (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: [build, build-pure-distributions]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15-intel
            platform: macos-intel
          - os: macos-latest
            platform: macos-arm64
          - os: windows-2022
            platform: windows-amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set package version from release tag
        if: github.event_name == 'release'
        run: >-
          python -c "import os, subprocess, sys; subprocess.run([sys.executable,
          'scripts/update_version.py', '--version', os.environ['GITHUB_REF_NAME'].removeprefix('v')], check=True)"

      - name: Validate package version declarations
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/update_version.py --check

      - name: Install wheel verification dependency
        run: python -m pip install packaging

      - name: Enable MSVC dependency inspection
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download platform wheels
        uses: actions/download-artifact@v4
        with:
          pattern: native-${{ matrix.platform }}-*
          path: ${{ runner.temp }}/wheelhouse
          merge-multiple: true

      - name: Download pure Python wheels
        uses: actions/download-artifact@v4
        with:
          name: pure-distributions
          path: ${{ runner.temp }}/verify-wheelhouse

      - name: Verify complete platform wheel set
        shell: bash
        env:
          WHEELHOUSE: ${{ runner.temp }}/wheelhouse
          VERIFY_WHEELHOUSE: ${{ runner.temp }}/verify-wheelhouse
          MATRIX_WORKDIR: ${{ runner.temp }}/labneura-release-wheel-matrix
        run: |
          version=$(python scripts/update_version.py --get-version)
          python - "$VERIFY_WHEELHOUSE" "$WHEELHOUSE" "$version" "${{ matrix.platform }}" <<'PY'
          import shutil
          import sys
          from email import message_from_bytes
          from pathlib import Path
          from zipfile import ZipFile

          from packaging.tags import sys_tags
          from packaging.utils import canonicalize_name, parse_wheel_filename

          verify_dir = Path(sys.argv[1])
          wheelhouse = Path(sys.argv[2])
          expected_version = sys.argv[3]
          platform = sys.argv[4]
          wheels = sorted(wheelhouse.rglob("*.whl"))
          pure_wheels = sorted(verify_dir.glob("*.whl"))
          if not wheels or len(pure_wheels) != 3:
              raise SystemExit(
                  f"incomplete wheel inputs: {len(wheels)} native and "
                  f"{len(pure_wheels)} pure wheels"
              )
          mismatches = []
          for wheel in wheels + pure_wheels:
              with ZipFile(wheel) as archive:
                  metadata_path = next(
                      path for path in archive.namelist()
                      if path.endswith(".dist-info/METADATA")
                  )
                  metadata = message_from_bytes(archive.read(metadata_path))
              if metadata["Version"] != expected_version:
                  mismatches.append(
                      f"{wheel.name}: {metadata['Version']} "
                      f"(expected {expected_version})"
                  )
          if mismatches:
              raise SystemExit(
                  "wheel version mismatch before platform verification:\n"
                  + "\n".join(mismatches)
              )

          supported = set(sys_tags())
          for distribution in ("labneura_tensor", "labneura_eda"):
              project_dir = wheelhouse / distribution.removeprefix("labneura_")
              compatible = []
              for wheel in project_dir.glob(f"{distribution}-*.whl"):
                  _, _, _, tags = parse_wheel_filename(wheel.name)
                  if tags & supported:
                      compatible.append(wheel)
              if not compatible:
                  raise SystemExit(
                      f"no CPython {sys.version_info.major}.{sys.version_info.minor} "
                      f"{distribution} wheel matches this runner"
                  )
              shutil.copy2(sorted(compatible)[0], verify_dir)
          if platform == "linux":
              for wheel in verify_dir.glob("*.whl"):
                  name, _, _, _ = parse_wheel_filename(wheel.name)
                  if canonicalize_name(name) in {
                      "labneura", "labneura-all", "labneura-core"
                  }:
                      shutil.copy2(wheel, wheelhouse)
          PY
          python scripts/verify_wheel_matrix.py "$VERIFY_WHEELHOUSE" \
            --version "$version" --workdir "$MATRIX_WORKDIR"

      - name: Run installed native EDA contract on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheelhouse = "$env:RUNNER_TEMP\verify-wheelhouse"
          $wheelPair = "$env:RUNNER_TEMP\windows-core-eda-pair"
          New-Item -ItemType Directory -Force $wheelPair | Out-Null
          Copy-Item "$wheelhouse\labneura_core-*.whl" $wheelPair
          Copy-Item "$wheelhouse\labneura_eda-*.whl" $wheelPair
          $version = python scripts/update_version.py --get-version
          python scripts/verify_windows_wheels.py `
            $wheelPair `
            --version $version `
            --extract-dir "$env:RUNNER_TEMP\windows-eda-inspect"
          $extension = Get-ChildItem "$env:RUNNER_TEMP\windows-eda-inspect" `
            -Recurse -File -Filter "*_eda*.pyd" | Select-Object -First 1
          if (-not $extension) { throw "Extracted EDA extension was not found" }
          $dependencies = & dumpbin /dependents $extension.FullName
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for $($extension.FullName)" }
          $dependencies
          if ($dependencies -match "(?i)slang") {
            throw "EDA extension links Slang"
          }
          $venvPython = (Get-ChildItem "$env:RUNNER_TEMP\labneura-release-wheel-matrix\W3\Scripts\python.exe").FullName
          $qualification = "$env:RUNNER_TEMP\windows-eda-contract"
          New-Item -ItemType Directory -Force $qualification | Out-Null
          Copy-Item tests/test_eda_native_contract.py "$qualification\test_eda_native_contract.py"
          & $venvPython -m pip install pytest
          $env:PYTHONNOUSERSITE = "1"
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Push-Location $qualification
          try {
            & $venvPython -m pytest -q -o addopts= test_eda_native_contract.py
            if ($LASTEXITCODE -ne 0) { throw "Windows installed EDA contract failed" }
          } finally {
            Pop-Location
          }

      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: ${{ runner.temp }}/wheelhouse/
          if-no-files-found: error

  release-qualification:
    name: Assemble qualified release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [verify-platform-wheels, build-source-distribution, native-release-tests]
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: ${{ runner.temp }}/labneura-release-dist
          merge-multiple: true
          if-no-artifact-found: ignore

      - name: Download qualified source distributions
        uses: actions/download-artifact@v4
        with:
          name: source-distributions
          path: ${{ runner.temp }}/labneura-release-dist

      - name: Install publishing tools
        run: python -m pip install --upgrade twine

      - name: Flatten downloaded wheel artifacts
        shell: bash
        env:
          WHEEL_DIST: ${{ runner.temp }}/labneura-release-dist
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          dist = Path(os.environ["WHEEL_DIST"])
          wheels = sorted(dist.rglob("*.whl"))
          if not wheels:
              raise SystemExit("no wheel artifacts were downloaded")
          for wheel in wheels:
              destination = dist / wheel.name
              if wheel.parent != dist:
                  if destination.exists():
                      raise SystemExit(f"duplicate wheel artifact: {wheel.name}")
                  wheel.replace(destination)
          for directory in sorted(
              (path for path in dist.rglob("*") if path.is_dir()),
              key=lambda path: len(path.parts),
              reverse=True,
          ):
              directory.rmdir()
          PY

      - name: Check distribution metadata
        shell: bash
        env:
          WHEEL_DIST: ${{ runner.temp }}/labneura-release-dist
        run: |
          python - <<'PY'
          from collections import defaultdict
          import os
          from pathlib import Path

          from packaging.utils import canonicalize_name, parse_wheel_filename

          wheel_dir = Path(os.environ["WHEEL_DIST"])
          expected = {
              "labneura-core", "labneura-tensor", "labneura-eda",
              "labneura", "labneura-all",
          }
          distributions = defaultdict(list)
          versions = set()
          wheel_versions = []
          for wheel in wheel_dir.glob("*.whl"):
              name, version, _, tags = parse_wheel_filename(wheel.name)
              canonical = canonicalize_name(name)
              if canonical not in expected:
                  raise SystemExit(f"unexpected wheel distribution: {wheel.name}")
              distributions[canonical].append((wheel, version, tags))
              versions.add(str(version))
              wheel_versions.append((wheel.name, str(version)))

          if set(distributions) != expected:
              raise SystemExit(
                  f"wheel distribution set mismatch: expected {sorted(expected)}, "
                  f"found {sorted(distributions)}"
              )
          if len(versions) != 1:
              details = ", ".join(
                  f"{filename}={version}" for filename, version in wheel_versions
              )
              raise SystemExit(
                  f"wheels do not share one release version {sorted(versions)}: "
                  f"{details}"
              )
          version = next(iter(versions))
          if os.environ.get("GITHUB_EVENT_NAME") == "release":
              release_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
              if version != release_version:
                  raise SystemExit(
                      f"wheel version {version} does not match release "
                      f"tag version {release_version}"
                  )
          for name in ("labneura-core", "labneura", "labneura-all"):
              if len(distributions[name]) != 1:
                  raise SystemExit(f"expected one pure wheel for {name}")

          python_tags = {f"cp{version}" for version in (38, 39, 310, 311, 312, 313)}
          platform_families = {
              "linux-x86_64": (python_tags, lambda platform:
                  platform.endswith("_x86_64") and
                  (platform.startswith("manylinux") or platform.startswith("musllinux"))),
              "linux-aarch64": (python_tags, lambda platform:
                  platform.endswith("_aarch64") and
                  (platform.startswith("manylinux") or platform.startswith("musllinux"))),
              "macos-x86_64": (python_tags, lambda platform:
                  platform.startswith("macosx_") and platform.endswith("_x86_64")),
              "macos-arm64": (python_tags, lambda platform:
                  platform.startswith("macosx_") and platform.endswith("_arm64")),
              "windows-amd64": (python_tags, lambda platform:
                  platform == "win_amd64"),
          }
          for name in ("labneura-tensor", "labneura-eda"):
              tags = {
                  tag for _, _, wheel_tags in distributions[name]
                  for tag in wheel_tags
              }
              for family, (required_python_tags, matches) in platform_families.items():
                  for python_tag in required_python_tags:
                      if not any(
                          tag.interpreter == python_tag and matches(tag.platform)
                          for tag in tags
                      ):
                          raise SystemExit(
                              f"{name} lacks {python_tag} wheel for {family}"
                          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"LABNEURA_WHEEL_VERSION={version}\n")
          print(f"Validated all five distributions at version {version}")
          print(f"Collected {sum(map(len, distributions.values()))} wheels")
          PY
          python -m pip install --upgrade twine
          python -m twine check "$WHEEL_DIST"/*.whl "$WHEEL_DIST"/*.tar.gz
          {
            echo "### Distributions queued for publishing"
            for distribution in "$WHEEL_DIST"/*.whl; do
              basename "$distribution"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain exact qualified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qualified-release-artifacts
          path: ${{ runner.temp }}/labneura-release-dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish qualified distributions to PyPI
        if: github.event_name == 'release'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive "$RUNNER_TEMP"/labneura-release-dist/*
