name: Publish Python Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sync-release-version:
    name: Sync release version
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update version files from release tag
        run: python scripts/update_version.py --version "${GITHUB_REF_NAME#v}"

      - name: Open version sync pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/sync-release-version
          delete-branch: true
          add-paths: |
            pyproject.toml
            CMakeLists.txt
            python/labneura_py.cpp
            packaging/core/src/labneura/__init__.py
            packaging/tensor/pyproject.toml
            packaging/eda/pyproject.toml
            packaging/compat/pyproject.toml
            packaging/all/pyproject.toml
          commit-message: "chore: sync version for ${{ github.event.release.tag_name }}"
          title: "chore: sync version for ${{ github.event.release.tag_name }}"
          body: |
            Sync package version declarations with release tag `${{ github.event.release.tag_name }}`.

            The release workflow builds and publishes using this tag as the package version.

  build:
    name: Build split distributions (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            linux_arch: x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            arch: arm64
            linux_arch: aarch64
          - os: macos-15-intel
            platform: macos-intel
            arch: x86_64
            linux_arch: ""
          - os: macos-latest
            platform: macos-arm64
            arch: arm64
            linux_arch: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set package version from release tag
        if: github.event_name == 'release'
        run: python scripts/update_version.py --version "${GITHUB_REF_NAME#v}"

      - name: Validate package version declarations
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/update_version.py --check

      - name: Install wheel build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build cibuildwheel==2.22.0 scikit-build-core pybind11 wheel 'setuptools>=61' pytest

      - name: Build pure Python wheels for verification
        env:
          VERIFY_WHEELHOUSE: ${{ runner.temp }}/labneura-verify-wheelhouse
        run: |
          mkdir -p "$VERIFY_WHEELHOUSE"
          python -m build --wheel --no-isolation --outdir "$VERIFY_WHEELHOUSE" packaging/core
          python -m build --wheel --no-isolation --outdir "$VERIFY_WHEELHOUSE" packaging/compat
          python -m build --wheel --no-isolation --outdir "$VERIFY_WHEELHOUSE" packaging/all

      - name: Prepare wheelhouse
        if: matrix.platform == 'linux'
        env:
          VERIFY_WHEELHOUSE: ${{ runner.temp }}/labneura-verify-wheelhouse
          WHEELHOUSE: ${{ runner.temp }}/wheelhouse
        run: |
          mkdir -p "$WHEELHOUSE"
          cp "$VERIFY_WHEELHOUSE"/*.whl "$WHEELHOUSE/"

      - name: Build Tensor wheels for supported CPython versions
        env:
          CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*
          CIBW_ARCHS_LINUX: ${{ matrix.linux_arch }}
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
          WHEELHOUSE: ${{ runner.temp }}/wheelhouse
        run: |
          mkdir -p "$WHEELHOUSE/tensor"
          python -m cibuildwheel packaging/tensor --output-dir "$WHEELHOUSE/tensor"

      - name: Build EDA wheels for supported CPython versions
        env:
          CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*
          CIBW_ARCHS_LINUX: ${{ matrix.linux_arch }}
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
          WHEELHOUSE: ${{ runner.temp }}/wheelhouse
        run: |
          mkdir -p "$WHEELHOUSE/eda"
          python -m cibuildwheel packaging/eda --output-dir "$WHEELHOUSE/eda"

      - name: Verify wheels and isolated installation matrix
        env:
          VERIFY_WHEELHOUSE: ${{ runner.temp }}/labneura-verify-wheelhouse
          WHEELHOUSE: ${{ runner.temp }}/wheelhouse
          MATRIX_WORKDIR: ${{ runner.temp }}/labneura-release-wheel-matrix
        run: |
          python - "$VERIFY_WHEELHOUSE" "$WHEELHOUSE" <<'PY'
          import shutil
          import sys
          from pathlib import Path

          from packaging.tags import sys_tags
          from packaging.utils import parse_wheel_filename

          verify_dir = Path(sys.argv[1])
          wheelhouse = Path(sys.argv[2])
          supported = set(sys_tags())
          for distribution in ("labneura_tensor", "labneura_eda"):
              project_dir = wheelhouse / distribution.removeprefix("labneura_")
              compatible = []
              for wheel in project_dir.glob(f"{distribution}-*.whl"):
                  _, _, _, tags = parse_wheel_filename(wheel.name)
                  if tags & supported:
                      compatible.append(wheel)
              if not compatible:
                  raise SystemExit(
                      f"no CPython {sys.version_info.major}.{sys.version_info.minor} "
                      f"{distribution} wheel matches this runner"
                  )
              shutil.copy2(sorted(compatible)[0], verify_dir)
          PY
          version=$(python scripts/update_version.py --get-version)
          python scripts/verify_wheel_matrix.py "$VERIFY_WHEELHOUSE" \
            --version "$version" --workdir "$MATRIX_WORKDIR"

      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: ${{ runner.temp }}/wheelhouse/
          if-no-files-found: error

  publish:
    name: Publish distributions
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
          if-no-artifact-found: ignore

      - name: Install publishing tools
        run: python -m pip install --upgrade twine

      - name: Flatten downloaded wheel artifacts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          dist = Path("dist")
          wheels = sorted(dist.rglob("*.whl"))
          if not wheels:
              raise SystemExit("no wheel artifacts were downloaded")
          for wheel in wheels:
              destination = dist / wheel.name
              if wheel.parent != dist:
                  if destination.exists():
                      raise SystemExit(f"duplicate wheel artifact: {wheel.name}")
                  wheel.replace(destination)
          for directory in sorted(
              (path for path in dist.rglob("*") if path.is_dir()),
              key=lambda path: len(path.parts),
              reverse=True,
          ):
              directory.rmdir()
          PY

      - name: Check distribution metadata
        shell: bash
        run: |
          python - <<'PY'
          from collections import defaultdict
          from pathlib import Path

          from packaging.utils import canonicalize_name, parse_wheel_filename

          expected = {
              "labneura-core", "labneura-tensor", "labneura-eda",
              "labneura", "labneura-all",
          }
          distributions = defaultdict(list)
          versions = set()
          for wheel in Path("dist").glob("*.whl"):
              name, version, _, tags = parse_wheel_filename(wheel.name)
              canonical = canonicalize_name(name)
              if canonical not in expected:
                  raise SystemExit(f"unexpected wheel distribution: {wheel.name}")
              distributions[canonical].append((wheel, version, tags))
              versions.add(str(version))

          if set(distributions) != expected:
              raise SystemExit(
                  f"wheel distribution set mismatch: expected {sorted(expected)}, "
                  f"found {sorted(distributions)}"
              )
          if len(versions) != 1:
              raise SystemExit(f"wheels do not share one release version: {sorted(versions)}")
          for name in ("labneura-core", "labneura", "labneura-all"):
              if len(distributions[name]) != 1:
                  raise SystemExit(f"expected one pure wheel for {name}")

          python_tags = {f"cp{version}" for version in (38, 39, 310, 311, 312, 313)}
          platform_families = {
              "linux-x86_64": lambda platform: platform.endswith("_x86_64") and
                  (platform.startswith("manylinux") or platform.startswith("musllinux")),
              "linux-aarch64": lambda platform: platform.endswith("_aarch64") and
                  (platform.startswith("manylinux") or platform.startswith("musllinux")),
              "macos-x86_64": lambda platform: platform.startswith("macosx_") and
                  platform.endswith("_x86_64"),
              "macos-arm64": lambda platform: platform.startswith("macosx_") and
                  platform.endswith("_arm64"),
          }
          for name in ("labneura-tensor", "labneura-eda"):
              tags = {
                  tag for _, _, wheel_tags in distributions[name]
                  for tag in wheel_tags
              }
              for python_tag in python_tags:
                  for family, matches in platform_families.items():
                      if not any(
                          tag.interpreter == python_tag and matches(tag.platform)
                          for tag in tags
                      ):
                          raise SystemExit(
                              f"{name} lacks {python_tag} wheel for {family}"
                          )
          print(f"Validated all five distributions at version {next(iter(versions))}")
          print(f"Collected {sum(map(len, distributions.values()))} wheels")
          PY
          python -m pip install --upgrade twine
          python -m twine check dist/*.whl
          {
            echo "### Distributions queued for publishing"
            for distribution in dist/*.whl; do
              basename "$distribution"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to PyPI
        if: github.event_name == 'release'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive dist/*

      - name: Publish to TestPyPI (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          python -m twine upload --repository testpypi --non-interactive dist/*
