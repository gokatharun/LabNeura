name: Publish Python Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sync-release-version:
    name: Sync release version
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update version files from release tag
        run: python scripts/update_version.py --version "${GITHUB_REF_NAME#v}"

      - name: Open version sync pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/sync-release-version
          delete-branch: true
          add-paths: |
            pyproject.toml
            python/labneura_py.cpp
          commit-message: "chore: sync version for ${{ github.event.release.tag_name }}"
          title: "chore: sync version for ${{ github.event.release.tag_name }}"
          body: |
            Sync package version declarations with release tag `${{ github.event.release.tag_name }}`.

            The release workflow builds and publishes using this tag as the package version.

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            linux_arch: x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            arch: arm64
            linux_arch: aarch64
          - os: macos-15-intel
            platform: macos-intel
            arch: x86_64
            linux_arch: ""
          - os: macos-latest
            platform: macos-arm64
            arch: arm64
            linux_arch: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set package version from release tag
        if: github.event_name == 'release'
        run: python scripts/update_version.py --version "${GITHUB_REF_NAME#v}"

      - name: Validate package version declarations
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/update_version.py --check

      - name: Install wheel build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build cibuildwheel==2.22.0

      - name: Build source distribution
        if: matrix.platform == 'linux'
        run: |
          python -m build --sdist --outdir wheelhouse

      - name: Build platform wheels
        id: wheel-build
        shell: bash
        env:
          CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*
          CIBW_ARCHS_LINUX: ${{ matrix.linux_arch }}
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_TEST_COMMAND: python -c "import labneura"
        run: |
          set +e
          set -o pipefail
          python -m cibuildwheel --output-dir wheelhouse 2>&1 | tee cibuildwheel.log
          build_status=${PIPESTATUS[0]}
          set -e

          if [ "$build_status" -eq 0 ]; then
            echo "Wheel build succeeded for ${{ matrix.platform }}."
            echo "### ${{ matrix.platform }} wheel build: succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Wheel build failed::${{ matrix.platform }} wheel build exited with status $build_status; publishing any wheels that completed."
            {
              echo "### ${{ matrix.platform }} wheel build: partial or failed"
              echo "cibuildwheel exited with status $build_status. Any completed distributions will still be uploaded and published."
              echo
              echo "#### Build diagnostics"
              echo '```text'
              grep -Ei 'error|failed|failure' cibuildwheel.log | tail -n 60 || tail -n 60 cibuildwheel.log
              echo '```'
              echo
              echo "#### Distributions produced"
              for file in wheelhouse/*; do
                if [ -f "$file" ]; then basename "$file"; fi
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "exit_code=$build_status" >> "$GITHUB_OUTPUT"

      - name: Upload built packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: wheelhouse/*
          if-no-files-found: ignore

  publish:
    name: Publish distributions
    runs-on: ubuntu-latest
    needs: build
    if: always() && !cancelled()
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
          if-no-artifact-found: ignore

      - name: Install publishing tools
        run: python -m pip install --upgrade twine

      - name: Check distribution metadata
        shell: bash
        run: |
          shopt -s nullglob
          distributions=(dist/*)
          if [ "${#distributions[@]}" -eq 0 ]; then
            echo "::error::No distributions were built successfully; nothing can be published."
            exit 1
          fi

          python -m twine check "${distributions[@]}"
          {
            echo "### Distributions queued for publishing"
            for distribution in "${distributions[@]}"; do
              basename "$distribution"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to PyPI
        if: github.event_name == 'release'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive dist/*

      - name: Publish to TestPyPI (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          python -m twine upload --repository testpypi --non-interactive dist/*
