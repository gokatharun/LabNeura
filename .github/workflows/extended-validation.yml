name: LabNeura Extended Validation

on:
  workflow_dispatch:
  schedule:
    - cron: '27 2 * * 1'

permissions:
  contents: read

concurrency:
  group: extended-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-coverage:
    name: Native C++ coverage (Clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install coverage tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Configure instrumented build
        env: {CC: clang, CXX: clang++}
        run: >-
          cmake -S . -B build/coverage -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON -DLABNEURA_ENABLE_COVERAGE=ON
          -DLABNEURA_ENABLE_SLANG_VALIDATION=OFF
          -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - name: Build and execute all native CTests
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/build/coverage/profiles/%p-%m.profraw
        run: |
          cmake --build build/coverage --parallel 2
          mkdir -p build/coverage/profiles
          ctest --test-dir build/coverage --output-on-failure --no-tests=error
      - name: Generate native coverage report
        run: |
          python scripts/coverage_report.py --build-dir build/coverage --profiles build/coverage/profiles --output coverage/native
          python scripts/write_coverage_summary.py --native coverage/native/native-summary.json --output COVERAGE.md
          cat COVERAGE.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: native-coverage
          path: |
            COVERAGE.md
            coverage/native
          if-no-files-found: error

  eda-sanitizers:
    name: EDA ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure EDA-only sanitizer build
        env: {CC: clang, CXX: clang++}
        run: >-
          cmake -S . -B build/eda-sanitizers -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON -DLABNEURA_BUILD_ACCEL_CORE=OFF
          -DLABNEURA_BUILD_TENSOR=OFF -DLABNEURA_BUILD_COMPAT=OFF
          -DLABNEURA_BUILD_EDA=ON -DLABNEURA_ENABLE_SLANG_VALIDATION=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build and run EDA-only CTests
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: 'print_stacktrace=1:halt_on_error=1'
        run: |
          cmake --build build/eda-sanitizers --parallel 2
          ctest --test-dir build/eda-sanitizers --output-on-failure --no-tests=error

  eda-source-distribution:
    name: EDA source distribution without Slang
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install build scikit-build-core pybind11 wheel 'setuptools>=61'
      - name: Build EDA source distribution and a wheel from it
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
          CMAKE_ARGS: >-
            -DLABNEURA_ENABLE_SLANG_VALIDATION=OFF
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON
        run: |
          mkdir -p dist/source wheel-from-source
          python scripts/build_eda_sdist.py --outdir dist/source
          tar -xzf dist/source/labneura_eda-*.tar.gz -C dist/source
          source_root=$(find dist/source -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -f "$source_root/CMakeLists.txt"
          test -f "$source_root/python/eda_module.cpp"
          test -d "$source_root/src/labneura/eda"
          ! tar -tzf dist/source/labneura_eda-*.tar.gz | grep -i slang
          python -m build --wheel --no-isolation --outdir wheel-from-source "$source_root"
      - uses: actions/upload-artifact@v4
        with:
          name: eda-source-distribution
          path: |
            dist/source/*.tar.gz
            wheel-from-source/*.whl
          if-no-files-found: error

  yosys-equivalence:
    name: Native EDA Yosys equivalence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the independent formal oracle
        run: sudo apt-get update && sudo apt-get install -y yosys
      - name: Configure EDA-only build and prove supported designs
        run: |
          cmake -S . -B build/yosys -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DLABNEURA_BUILD_ACCEL_CORE=OFF -DLABNEURA_BUILD_TENSOR=OFF -DLABNEURA_BUILD_COMPAT=OFF -DLABNEURA_BUILD_EDA=ON -DLABNEURA_ENABLE_SLANG_VALIDATION=OFF -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          cmake --build build/yosys --target labneura_eda_verilog_native_formal_equivalence_test --parallel 2
          ctest --test-dir build/yosys --output-on-failure --no-tests=error -R '^eda_verilog_native_formal_equivalence$'

  slang-lexer-differential:
    name: Pinned Slang lexer differential (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env: {SLANG_COMMIT: 7ddf4059f79eff508dd486eb42fd650cdf320d52}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x86_64, backend: AVX2}
          - {os: ubuntu-24.04-arm, platform: linux-arm64, backend: NEON}
          - {os: macos-latest, platform: macos-arm64, backend: NEON}
          - {os: windows-2022, platform: windows-x86_64-msvc, backend: AVX2}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with: {arch: x64}
      - name: Provision pinned external Slang (Unix)
        if: runner.os != 'Windows'
        run: |
          git clone --filter=blob:none https://github.com/MikePopoloski/slang.git "$RUNNER_TEMP/slang-src"
          git -C "$RUNNER_TEMP/slang-src" checkout "$SLANG_COMMIT"
          cmake -S "$RUNNER_TEMP/slang-src" -B "$RUNNER_TEMP/slang-build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/slang-install" -DSLANG_INCLUDE_TESTS=OFF -DSLANG_INCLUDE_TOOLS=OFF -DSLANG_INCLUDE_PYLIB=OFF -DSLANG_INCLUDE_DOCS=OFF -DSLANG_INCLUDE_INSTALL=ON -DSLANG_USE_MIMALLOC=OFF
          cmake --build "$RUNNER_TEMP/slang-build" --target install --parallel 2
      - name: Provision pinned external Slang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/MikePopoloski/slang.git "$env:RUNNER_TEMP/slang-src"
          git -C "$env:RUNNER_TEMP/slang-src" checkout $env:SLANG_COMMIT
          cmake -S "$env:RUNNER_TEMP/slang-src" -B "$env:RUNNER_TEMP/slang-build" -A x64 -DCMAKE_INSTALL_PREFIX="$env:RUNNER_TEMP/slang-install" -DSLANG_INCLUDE_TESTS=OFF -DSLANG_INCLUDE_TOOLS=OFF -DSLANG_INCLUDE_PYLIB=OFF -DSLANG_INCLUDE_DOCS=OFF -DSLANG_INCLUDE_INSTALL=ON -DSLANG_USE_MIMALLOC=OFF
          cmake --build "$env:RUNNER_TEMP/slang-build" --config Release --target install --parallel 2
      - name: Configure and test differential build (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build/slang-validation -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/slang-install" -DBUILD_TESTING=ON -DLABNEURA_BUILD_ACCEL_CORE=OFF -DLABNEURA_BUILD_TENSOR=OFF -DLABNEURA_BUILD_COMPAT=OFF -DLABNEURA_BUILD_EDA=ON -DLABNEURA_ENABLE_SLANG_VALIDATION=ON -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          cmake --build build/slang-validation --target labneura_eda_verilog_lexer_test labneura_lexer_slang_benchmark --parallel 2
          ctest --test-dir build/slang-validation --output-on-failure --no-tests=error -R '^eda_verilog_lexer$'
          build/slang-validation/labneura_eda_verilog_lexer_test SCALAR
          build/slang-validation/labneura_eda_verilog_lexer_test "${{ matrix.backend }}"
          build/slang-validation/labneura_lexer_slang_benchmark tests/data/verilog/lexer_corpus.sv examples/verilog/ibex/ibex_alu.sv examples/verilog/8080_core/i8080.v | tee lexer-benchmark.log
      - name: Configure and test differential build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build/slang-validation -A x64 -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP/slang-install" -DBUILD_TESTING=ON -DLABNEURA_BUILD_ACCEL_CORE=OFF -DLABNEURA_BUILD_TENSOR=OFF -DLABNEURA_BUILD_COMPAT=OFF -DLABNEURA_BUILD_EDA=ON -DLABNEURA_ENABLE_SLANG_VALIDATION=ON -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          cmake --build build/slang-validation --config Release --target labneura_eda_verilog_lexer_test labneura_lexer_slang_benchmark --parallel 2
          ctest --test-dir build/slang-validation -C Release --output-on-failure --no-tests=error -R '^eda_verilog_lexer$'
          & build/slang-validation/Release/labneura_eda_verilog_lexer_test.exe SCALAR
          if ($LASTEXITCODE -ne 0) { throw 'scalar lexer parity failed' }
          & build/slang-validation/Release/labneura_eda_verilog_lexer_test.exe '${{ matrix.backend }}'
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 77) { throw 'SIMD lexer parity failed' }
          & build/slang-validation/Release/labneura_lexer_slang_benchmark.exe tests/data/verilog/lexer_corpus.sv examples/verilog/ibex/ibex_alu.sv examples/verilog/8080_core/i8080.v 2>&1 | Tee-Object lexer-benchmark.log
          if ($LASTEXITCODE -ne 0) { throw 'lexer comparison benchmark failed' }
      - name: Require comparable lexer output (Unix)
        if: runner.os != 'Windows'
        run: |
          grep -q 'backend=scalar' lexer-benchmark.log
          grep -q 'backend=slang' lexer-benchmark.log
      - name: Require comparable lexer output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Select-String -Path lexer-benchmark.log -Pattern 'backend=scalar' -Quiet)) { throw 'native scalar benchmark result missing' }
          if (-not (Select-String -Path lexer-benchmark.log -Pattern 'backend=slang' -Quiet)) { throw 'Slang benchmark result missing' }
      - name: Convert lexer comparison to a structured artifact
        run: python scripts/lexer_benchmark_report.py parse --input lexer-benchmark.log --output lexer-benchmark.json --platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: slang-lexer-differential-${{ matrix.platform }}
          path: |
            lexer-benchmark.log
            lexer-benchmark.json
          if-no-files-found: error
